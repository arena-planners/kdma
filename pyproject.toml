[project]
name = "arena_planners_kdma"
version = "0.0.0"
description = "KDMA planner adapter for arena_planners bridge."
requires-python = ">=3.10,<3.12"
dependencies = [
    "arena_planners",
    "torch>=1.13,<2.4",
    "numpy<2",
]

[tool.uv.sources]
arena_planners = { git = "https://github.com/arena-planners/arena_planners.git", branch = "jazzy", subdirectory = "arena_planners" }

[tool.setuptools]
packages = []
py-modules = []

[tool.ruff.lint.isort]
known-first-party = ["networks"]
